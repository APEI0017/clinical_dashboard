<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>臨床知識看板</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#fff;--bg2:#f8f8f7;--bg3:#f1f0eb;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#9b9b9b;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --blue:#185FA5;--blue-dark:#0C447C;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green:#1A7C4A;--green-bg:#E1F5EE;--green-text:#085041;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --purple:#3C3489;--purple-bg:#EEEDFE;
  --radius:8px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
input,select,textarea,button{font-family:'Inter',sans-serif}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
.app{max-width:1100px;margin:0 auto;padding:1.5rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
.header-right{display:flex;gap:8px;align-items:center}
.user-chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);background:var(--bg);border:0.5px solid var(--border2);padding:5px 10px;border-radius:20px;cursor:pointer}
.user-chip img{width:20px;height:20px;border-radius:50%}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.conn-dot.ok{background:#22c55e}.conn-dot.err{background:var(--red)}
.tabs{display:flex;gap:4px;margin-bottom:1.25rem;background:var(--bg);border-radius:var(--radius-lg);padding:4px;border:0.5px solid var(--border);box-shadow:var(--shadow)}
.tab{flex:1;text-align:center;padding:8px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);transition:all .15s}
.tab.active{background:var(--blue);color:#fff}
.tab-panel{display:none}.tab-panel.active{display:block}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;white-space:nowrap;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
.btn-outline{background:none;border:0.5px solid var(--border2);color:var(--text2)}.btn-outline:hover{background:var(--bg2)}
.btn-ghost{background:none;border:none;color:var(--text2);padding:4px 8px}.btn-ghost:hover{background:var(--bg2)}
.btn-danger{background:none;border:0.5px solid var(--red);color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{filter:brightness(.9)}
.btn-sm{padding:5px 10px;font-size:12px}
.section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.75rem;overflow:hidden;box-shadow:var(--shadow)}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;cursor:pointer;user-select:none}
.section-hd:hover{background:var(--bg2)}
.section-hd-left{display:flex;align-items:center;gap:10px}
.section-title{font-size:14px;font-weight:500}
.section-sub{font-size:12px;color:var(--text3)}
.chevron{font-size:16px;color:var(--text3);transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.section-bd{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .2s;padding:0 1.25rem}
.section-bd.open{max-height:5000px;padding:0 1.25rem 1.25rem}
.field-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:5px}
.plain-input{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
.plain-input:focus{border-color:var(--blue)}
.textarea{width:100%;font-size:13px;padding:10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);resize:vertical;min-height:80px;outline:none;line-height:1.7}
.textarea:focus{border-color:var(--blue)}
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;user-select:none;transition:all .15s}
.tag:hover{border-color:var(--blue);color:var(--blue)}
.tag.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag.dragging{opacity:.4}.tag.drag-over{border-color:var(--blue);transform:scale(1.05)}
.tag-add{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px dashed var(--border2);color:var(--text3);cursor:pointer;background:none}
.tag-add:hover{border-color:var(--blue);color:var(--blue)}
.tag-edit-input{font-size:12px;padding:3px 8px;border:0.5px solid var(--blue);border-radius:20px;outline:none;width:90px;background:var(--bg)}
.imp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.quick-bar{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:.75rem 1rem;margin-bottom:.75rem;display:flex;gap:8px;align-items:flex-end;box-shadow:var(--shadow)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;cursor:pointer;transition:all .15s;position:relative;box-shadow:var(--shadow)}
.card:hover{border-color:var(--border2);box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.card.imp-red{border-left:3px solid var(--red)}.card.imp-amber{border-left:3px solid var(--amber)}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:8px}
.card-title{font-size:14px;font-weight:500;line-height:1.4;flex:1}
.card-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{font-size:15px;cursor:pointer;color:var(--text3);background:none;border:none;padding:3px;line-height:1;border-radius:var(--radius)}
.icon-btn:hover{color:var(--text);background:var(--bg2)}
.icon-btn.starred{color:#EF9F27}
.card-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.chip{font-size:11px;padding:2px 7px;border-radius:20px}
.chip-ctx{background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)}
.chip-case{background:var(--purple-bg);color:var(--purple);font-family:monospace}
.chip-link{background:var(--purple-bg);color:var(--purple);border:0.5px solid var(--purple);cursor:pointer}
.card-preview{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{font-size:11px;color:var(--text3);margin-top:7px;display:flex;align-items:center;justify-content:space-between}
.review-badge{position:absolute;top:10px;right:10px;font-size:10px;background:var(--amber-bg);color:var(--amber-text);padding:2px 7px;border-radius:20px;font-weight:500}
.review-banner{background:var(--amber-bg);border:0.5px solid var(--amber);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:10px;cursor:pointer}
.review-banner p{font-size:13px;color:var(--amber-text);flex:1}
.top-bar{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3);pointer-events:none}
.search-input{width:100%;padding:8px 10px 8px 32px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
.search-input:focus{border-color:var(--blue)}
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty-state i{font-size:36px;display:block;margin-bottom:10px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:780px;padding:1.5rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius)}
.modal-close:hover{background:var(--bg2)}
.modal h2{font-size:17px;font-weight:600;margin-bottom:.5rem;padding-right:2rem;line-height:1.3}
.dim-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:1rem 0 .75rem}
.dim-tab{font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .15s}
.dim-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.dim-nav{display:flex;gap:6px;margin-bottom:6px}
.dim-nav-btn{background:none;border:0.5px solid var(--border2);padding:3px 10px;border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--text2)}
.dim-nav-btn:hover{background:var(--bg2)}
.content-area{background:var(--bg2);border-radius:var(--radius);padding:1rem;min-height:120px;font-size:13px;line-height:1.9;position:relative}
.content-area strong{font-weight:600}.content-area em{font-style:italic}
.content-area mark{background:#FFF176;padding:0 2px;border-radius:2px}
.content-area code{background:var(--bg3);padding:1px 4px;border-radius:3px;font-family:monospace;font-size:12px}
.content-area pre{background:var(--bg3);padding:8px 10px;border-radius:var(--radius);font-family:monospace;font-size:12px;overflow-x:auto;margin:4px 0;white-space:pre-wrap}
.content-area table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.content-area th{background:var(--bg3);font-weight:600;padding:4px 8px;border:0.5px solid var(--border2)}
.content-area td{padding:4px 8px;border:0.5px solid var(--border2)}
.content-area h1{font-size:15px;font-weight:600;margin:10px 0 4px}
.content-area h2{font-size:13px;font-weight:600;margin:10px 0 3px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.content-area h3{font-size:12px;font-weight:600;color:var(--text2);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.3px}
.source-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:var(--radius);margin-left:3px;font-weight:500}
.badge-orig{background:var(--green-bg);color:var(--green-text)}
.badge-ai{background:var(--blue-bg);color:var(--blue-text)}
.float-toolbar{position:fixed;z-index:200;background:var(--text);border-radius:var(--radius);padding:4px 6px;display:flex;gap:2px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.float-toolbar button{background:none;border:none;color:#fff;cursor:pointer;padding:4px 7px;border-radius:5px;font-size:13px;font-weight:500}
.float-toolbar button:hover{background:rgba(255,255,255,.15)}
.notes-section{margin-top:1rem}
.notes-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.notes-toolbar{display:flex;gap:4px;margin-bottom:4px}
.notes-tool{background:none;border:0.5px solid var(--border2);padding:3px 8px;border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--text2)}
.notes-tool:hover{background:var(--bg2)}
.notes-preview{background:var(--bg2);border-radius:var(--radius);padding:10px;font-size:13px;line-height:1.9;min-height:60px;display:none}
.notes-preview strong{font-weight:600}.notes-preview em{font-style:italic}
.notes-preview mark{background:#FFF176;padding:0 2px;border-radius:2px}
.ref-section{margin-top:1rem}
.ref-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ref-rendered a{color:var(--blue);word-break:break-all}
.ref-rendered div{font-size:13px;margin:3px 0;line-height:1.7}
.edit-field{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);resize:vertical;min-height:80px;outline:none;line-height:1.6;margin-bottom:4px}
.edit-field:focus{border-color:var(--blue)}
.link-picker{background:var(--bg2);border-radius:var(--radius);padding:.75rem;max-height:240px;overflow-y:auto;margin-top:4px}
.link-search{width:100%;font-size:13px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;margin-bottom:8px}
.link-search:focus{border-color:var(--blue)}
.link-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.ai-loading{display:none;align-items:center;gap:8px;font-size:13px;color:var(--text2);padding:8px 0}
.ai-loading.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{width:100%;font-size:13px;padding:7px 36px 7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
.pw-toggle{position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);padding:0}
.select-input{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.export-wrap{position:relative}
.export-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);z-index:10;min-width:200px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.export-menu button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:13px;background:none;border:none;cursor:pointer;color:var(--text);font-family:'Inter',sans-serif}
.export-menu button:hover{background:var(--bg2)}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg3)}
.login-card{background:var(--bg);border-radius:var(--radius-lg);padding:3rem;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08);max-width:400px;width:90%}
.login-card h1{font-size:22px;font-weight:600;margin-bottom:8px}
.login-card p{font-size:14px;color:var(--text2);margin-bottom:2rem;line-height:1.6}
.google-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:14px;font-weight:500;color:var(--text);transition:all .15s;width:100%;justify-content:center}
.google-btn:hover{background:var(--bg2)}
.float-panel{position:fixed;z-index:200;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:200px}
/* Toast */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:rgba(26,26,26,0.9);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:999;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.toast.error{background:rgba(163,45,45,0.95)}
</style>
</head>
<body>

<!-- Login -->
<div id="login-screen" class="login-screen" style="display:none">
  <div class="login-card">
    <i class="ti ti-stethoscope" style="font-size:40px;color:var(--blue);display:block;margin-bottom:12px"></i>
    <h1>臨床知識看板</h1>
    <p>個案記錄 · 知識卡片 · 智慧複習</p>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
      </svg>
      使用 Google 帳號登入
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Main -->
<div id="main-app" style="display:none">
<div class="app">

  <div class="header">
    <div><h1><i class="ti ti-stethoscope" style="margin-right:6px;color:var(--blue)"></i>臨床知識看板</h1></div>
    <div class="header-right">
      <span style="font-size:12px;color:var(--text2)">
        <span class="conn-dot ok" id="conn-dot"></span><span id="conn-text">已連線</span>
      </span>
      <div class="export-wrap">
        <button class="btn btn-ghost btn-sm" onclick="toggleExportMenu()"><i class="ti ti-download"></i> 匯出</button>
        <div class="export-menu" id="export-menu" style="display:none">
          <button onclick="doExport('all','csv')"><i class="ti ti-table"></i> 全部（CSV / Google Sheets）</button>
          <button onclick="doExport('filtered','csv')"><i class="ti ti-filter"></i> 篩選結果（CSV）</button>
          <button onclick="doExport('all','md')"><i class="ti ti-markdown"></i> 全部（Markdown）</button>
          <button onclick="doExport('filtered','md')"><i class="ti ti-filter"></i> 篩選結果（Markdown）</button>
          <button onclick="doExport('all','json')"><i class="ti ti-file-type-js"></i> 全部（JSON）</button>
          <button onclick="doExport('filtered','json')"><i class="ti ti-filter"></i> 篩選結果（JSON）</button>
        </div>
      </div>
      <div class="user-chip" onclick="toggleSection('settings-sec')">
        <img id="user-avatar" src="" style="display:none">
        <i class="ti ti-user" id="user-icon"></i>
        <span id="user-name">設定</span>
      </div>
    </div>
  </div>

  <div id="review-banner" class="review-banner" style="display:none" onclick="showReviewCards()">
    <i class="ti ti-bell" style="font-size:18px;color:var(--amber)"></i>
    <p id="review-text"></p>
    <i class="ti ti-chevron-right" style="color:var(--amber-text)"></i>
  </div>

  <!-- Settings -->
  <div class="section" id="settings-sec">
    <div class="section-hd" onclick="toggleSection('settings-sec')">
      <div class="section-hd-left"><i class="ti ti-settings" style="color:var(--text3)"></i><span class="section-title">設定</span></div>
      <i class="ti ti-chevron-down chevron" id="settings-sec-chevron"></i>
    </div>
    <div class="section-bd" id="settings-sec-body">
      <div style="padding-bottom:1rem">
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:140px">
            <label class="field-label">AI 供應商</label>
            <select class="select-input" id="ai-provider" onchange="updateModelDefault()">
              <option value="gemini">Gemini（Google）</option>
              <option value="claude">Claude（Anthropic）</option>
              <option value="openai">OpenAI</option>
            </select>
          </div>
          <div style="flex:2;min-width:180px">
            <label class="field-label">Model 名稱</label>
            <input class="plain-input" type="text" id="ai-model" placeholder="gemini-2.0-flash"/>
          </div>
        </div>
        <label class="field-label">Supabase URL</label>
        <input class="plain-input" type="text" id="sb-url" placeholder="https://xxxxxx.supabase.co" style="margin-bottom:8px"/>
        <label class="field-label">Supabase Anon Key</label>
        <div class="pw-wrap" style="margin-bottom:12px">
          <input type="text" id="sb-key" placeholder="eyJhbGci..."/>
          <button class="pw-toggle" onclick="toggleVis('sb-key')"><i class="ti ti-eye"></i></button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="saveSettings()"><i class="ti ti-check"></i> 儲存設定</button>

};
var AI_PROMPT = '⚠️ 輸出格式規定（必須嚴格遵守）：\n- 所有條列項目必須用「- 」開頭，子項目用「  - 」縮排\n- 次標題用「## 」開頭，子標題用「### 」開頭\n- 重點關鍵字用 **文字** 標示粗體\n- 每個【】段落之間空一行，段落內不要多餘空行\n- 嚴禁純文字換行當條列\n- 嚴禁使用 emoji\n- 嚴禁使用表格（除非資料本身必須比較）\n\n你是住院醫師的臨床教師兼醫學教育專家。請把以下 OpenEvidence 內容整理成結構化摘要，輸出以下七個段落，每段用【】標示，條列式、精簡行動導向。原文內容後加[原文]，補充的知識加[AI補充 (來源 年份)]。\n\n七個維度各有明確範圍，請勿重疊：\n【診斷】怎麼診斷、鑑別診斷要點\n【處置】治療流程、一線藥物劑量、手術適應症\n【Work-up】檢查順序、抽血項目、影像學選擇\n【臨床價值】盲點（Pitfall）、容易漏掉的細節、人文關懷\n【核心知識點】定義、分類、關鍵數字（考試直接考的）\n【記憶法】口訣、聯想法、比喻（不重複前面內容）\n【必考延伸】Guideline 版本年份、爭議點、證據來源（只寫名稱年份，不捏造 URL）\n\n內容：';

var allCards = [], currentCard = null, currentDim = 0, currentTab = 'cases';

function cfg(k){return localStorage.getItem(k)||'';}
function setCfg(k,v){localStorage.setItem(k,v);}
function loadTags(){var s=cfg('tags_v2');if(s)tags=JSON.parse(s);}
function saveTags(){setCfg('tags_v2',JSON.stringify(tags));}

function showToast(msg, type){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.remove('error');
  if(type==='error') t.classList.add('error');
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show','error');}, type==='error'?3000:1500);
}
function showError(msg){ showToast(msg,'error'); }

function initSupabase(){
  var url=cfg('sb_url'),key=cfg('sb_key');
  if(!url||!key) return false;
  SB_URL=url.replace(/\/$/,'');SB_KEY=key;return true;
}

async function sbFetch(path,opts){
  opts=opts||{};
  var r=await fetch(SB_URL+'/rest/v1/'+path,{
    headers:Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+(currentUser?currentUser.access_token:SB_KEY),'Content-Type':'application/json','Prefer':'return=representation'},opts.headers||{}),
    method:opts.method||'GET',body:opts.body
  });
  if(!r.ok){var t=await r.text();throw new Error(t);}
  var ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():r.text();
}

function signInWithGoogle(){
  var url=SB_URL+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(window.location.origin+window.location.pathname);
  window.location.href=url;
}
function signOut(){setCfg('auth_token','');currentUser=null;showLogin();}

function handleAuthCallback(){
  var hash=window.location.hash;
  if(hash&&hash.includes('access_token')){
    var params=new URLSearchParams(hash.slice(1));
    var token=params.get('access_token');
    if(token){setCfg('auth_token',token);history.replaceState(null,'',window.location.pathname);currentUser={access_token:token};fetchUserInfo(token);return true;}
  }
  var saved=cfg('auth_token');
  if(saved){currentUser={access_token:saved};fetchUserInfo(saved);return true;}
  return false;
}

async function fetchUserInfo(token){
  try{
    var r=await fetch(SB_URL+'/auth/v1/user',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+token}});
    if(r.ok){
      var u=await r.json();currentUser=Object.assign({access_token:token},u);

// ── Markdown ──
function renderMd(text){
  if(!text) return '';
  text=text.replace(/\[原文\]/g,'__ORIG__').replace(/\[AI補充([^\]]*)\]/g,'__AI__$1__AIEND__');
  text=text.replace(/\n{3,}/g,'\n\n');
  var lines=text.split('\n'),html=[],inCode=false,inTable=false,inImplicit=false;
  for(var i=0;i<lines.length;i++){
    var line=lines[i],tr=line.trim();
    if(tr.startsWith('```')){inImplicit=false;if(!inCode){html.push('<pre><code>');inCode=true;}else{html.push('</code></pre>');inCode=false;}continue;}
    if(inCode){html.push(escHtml(line)+'\n');continue;}
    if(line.includes('|')&&tr.startsWith('|')){
      inImplicit=false;
      if(!inTable){html.push('<table>');inTable=true;}
      if(tr.includes('---')) continue;
      var cells=tr.replace(/^\||\|$/g,'').split('|');
      var isHdr=i===0||(lines[i+1]&&lines[i+1].includes('---'));
      var tg=isHdr?'th':'td';
      html.push('<tr>'+cells.map(function(c){return'<'+tg+'>'+inlineMd(c.trim())+'</'+tg+'>';}).join('')+'</tr>');continue;
    } else if(inTable){html.push('</table>');inTable=false;}
    if(/^### /.test(line)){inImplicit=false;html.push('<h3>'+inlineMd(line.slice(4))+'</h3>');continue;}
    if(/^## /.test(line)){inImplicit=false;html.push('<h2>'+inlineMd(line.slice(3))+'</h2>');continue;}
    if(/^# /.test(line)){inImplicit=false;html.push('<h1>'+inlineMd(line.slice(2))+'</h1>');continue;}
    if(/^- \[( |x)\] /.test(line)){inImplicit=false;var ck=line[3]==='x';html.push('<div style="display:flex;align-items:center;gap:6px;margin:2px 0"><input type="checkbox"'+(ck?' checked':'')+' onclick="return false"> '+inlineMd(line.slice(6))+'</div>');continue;}
    if(/^- /.test(line)){inImplicit=false;html.push('<div style="display:flex;gap:6px;margin:2px 0"><span style="color:var(--blue);flex-shrink:0">•</span><span>'+inlineMd(line.slice(2))+'</span></div>');continue;}
    if(/^ {2,}- /.test(line)){inImplicit=false;var dp=line.match(/^ +/)[0].length;html.push('<div style="display:flex;gap:6px;margin:2px 0;padding-left:'+Math.min(dp*6,24)+'px"><span style="color:var(--text3);flex-shrink:0">◦</span><span>'+inlineMd(tr.slice(2))+'</span></div>');continue;}
    if(/^\d+\. /.test(line)){inImplicit=false;var m2=line.match(/^(\d+)\. (.*)/);if(m2){html.push('<div style="display:flex;gap:6px;margin:2px 0"><span style="color:var(--blue);font-weight:500;flex-shrink:0">'+m2[1]+'.</span><span>'+inlineMd(m2[2])+'</span></div>');continue;}}
    if(tr===''){inImplicit=false;html.push('<div style="height:6px"></div>');continue;}
    var next=lines[i+1]?lines[i+1].trim():'';
    var isShort=tr.length<80;
    var nextShort=next.length>0&&next.length<80&&!next.startsWith('#')&&!next.startsWith('-')&&!/^\d+\./.test(next);
    var endsPunct=/[。.！!？?：:」』）)》]$/.test(tr);
    if(isShort&&!endsPunct&&(inImplicit||nextShort)){inImplicit=true;html.push('<div style="display:flex;gap:6px;margin:2px 0"><span style="color:var(--text3);flex-shrink:0">–</span><span>'+inlineMd(tr)+'</span></div>');}
    else{inImplicit=false;html.push('<p style="margin:3px 0;line-height:1.8">'+inlineMd(tr)+'</p>');}
  }
  if(inTable) html.push('</table>');
  if(inCode) html.push('</code></pre>');
  var result=html.join('');
  return result.replace(/__ORIG__/g,'<span class="source-badge badge-orig">原文</span>').replace(/__AI__(.*?)__AIEND__/g,'<span class="source-badge badge-ai">AI補充$1</span>');
}
function inlineMd(text){
  return text.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// ── Selection toolbar ──
function setupSelectionToolbar(){
  document.addEventListener('mouseup',function(e){
    var tb=document.getElementById('float-toolbar');
    if(tb.contains(e.target)) return;
    var sel=window.getSelection();
    if(!sel||sel.isCollapsed||!sel.toString().trim()){tb.style.display='none';return;}
    var range=sel.getRangeAt(0);
    var el=range.commonAncestorContainer;
    if(el.nodeType===3) el=el.parentElement;
    var inContent=false;
    while(el){if(el.classList&&(el.classList.contains('content-area')||el.classList.contains('notes-preview'))){inContent=true;activeContentEl=el;break;}el=el.parentElement;}
    if(!inContent){tb.style.display='none';return;}
    var rect=range.getBoundingClientRect();
    tb.style.left=(rect.left+rect.width/2-80)+'px';
    tb.style.top=(rect.top+window.scrollY-44)+'px';
    tb.style.display='flex';
  });
  document.addEventListener('mousedown',function(e){
    var tb=document.getElementById('float-toolbar');
    if(!tb.contains(e.target)) tb.style.display='none';
  });
}
function applyFormat(type){
  var sel=window.getSelection();if(!sel||sel.isCollapsed) return;
  var text=sel.toString(),formatted;
  if(type==='bold') formatted='**'+text+'**';
  else if(type==='highlight') formatted='=='+text+'==';
  else if(type==='italic') formatted='*'+text+'*';
  else if(type==='link'){var url=prompt('輸入連結 URL：','https://');if(!url) return;formatted='['+text+']('+url+')';}
  else return;
  var na=document.getElementById('vm-notes');
  if(document.activeElement===na){
    var s=na.selectionStart,e=na.selectionEnd;
    na.value=na.value.slice(0,s)+formatted+na.value.slice(e);
    na.focus();na.setSelectionRange(s,s+formatted.length);autoSaveNotes();
  } else {
    var ex=document.getElementById('vm-notes').value;
    document.getElementById('vm-notes').value=ex+'\n[標記] '+formatted;
    autoSaveNotes();
    try{var range=sel.getRangeAt(0),span=document.createElement('span');if(type==='bold')span.style.fontWeight='600';else if(type==='highlight')span.style.cssText='background:#FFF176;padding:0 2px;border-radius:2px';else if(type==='italic')span.style.fontStyle='italic';range.surroundContents(span);}catch(er){}
  }
  document.getElementById('float-toolbar').style.display='none';
}

function tagDragStart(e,t){dragSrcTag=t;setTimeout(function(){if(e.target)e.target.classList.add('dragging');},0);e.dataTransfer.effectAllowed='move';}
function tagDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function tagDragEnd(){document.querySelectorAll('.tag').forEach(function(el){el.classList.remove('dragging','drag-over');});}
function tagDrop(e,target){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(!dragSrcTag||dragSrcTag===target) return;
  var fi=tags.indexOf(dragSrcTag),ti=tags.indexOf(target);

  tags.splice(fi,1);tags.splice(ti,0,dragSrcTag);

function editTagStart(e,t){

  inp.onblur=function(){commitEditTag(t,inp.value.trim());};
  inp.onkeydown=function(ev){if(ev.key==='Enter')inp.blur();if(ev.key==='Escape')renderAllTagSelectors();};
  span.parentNode.replaceChild(inp,span);inp.focus();inp.select();
}
function commitEditTag(old,nv){
  if(!nv||nv===old){renderAllTagSelectors();return;}
  var idx=tags.indexOf(old);if(idx!==-1)tags[idx]=nv;
  [caseSelectedTags,cardSelectedTags,editSelectedTags,filterCaseTags,filterCardTags].forEach(function(s){if(s.has(old)){s.delete(old);s.add(nv);}});
  saveTags();renderAllTagSelectors();
}
function removeTag(e,t){

  saveTags();renderAllTagSelectors();
}

function commitAddTag(v){

function extractKeywords(text){
  if(!text) return [];
  var en=(text.match(/[A-Za-z]{3,}/g)||[]),zh=(text.match(/[\u4e00-\u9fa5]{2,4}/g)||[]),abbr=(text.match(/[A-Z]{2,6}/g)||[]);
  var stop={the:1,and:1,for:1,with:1,from:1,that:1,this:1,have:1,been:1,will:1,are:1,was:1,were:1,has:1,had:1,not:1,but:1,can:1,may:1,per:1,via:1,its:1,you:1,our:1,all:1};
  var all={};
  en.forEach(function(w){if(!stop[w.toLowerCase()]&&w.length>=3)all[w]=1;});
  abbr.forEach(function(w){all[w]=1;});zh.forEach(function(w){all[w]=1;});
  return Object.keys(all).slice(0,20);
}

function saveCase(){
  var title=document.getElementById('case-title').value.trim();
  var content=document.getElementById('case-content').value.trim();
  var caseNum=document.getElementById('case-number-input').value.trim();
  if(!title){alert('請填入標題！');return;}
  var card={
    id:'local_'+Date.now(),type:'case',title:title,
    case_number:caseNum||detectCaseNumber(content),
    importance:caseSelectedImp,contexts:Array.from(caseSelectedTags),
    content:content,notes:'',ref_links:'',linked_cards:[],
    review_due:null,starred:false,view_count:0,last_viewed:null,
    auto_keywords:extractKeywords(title+' '+content).join(' '),
    created_at:new Date().toISOString()
  };
  allCards.unshift(card);dbSave(card);renderCases();
  document.getElementById('case-title').value='';document.getElementById('case-content').value='';document.getElementById('case-number-input').value='';
  caseSelectedTags.clear();caseSelectedImp=impLevels[0]?impLevels[0].id:'red';
  renderTagSelector('case-tag-select',caseSelectedTags,'case');renderImpSelector('case-imp-select',caseSelectedImp,'case');
  toggleSection('quick-sec');showToast('個案已儲存');
}

// ── AI organize ──
async function aiOrganize(){
  var content=document.getElementById('card-oe-content').value.trim();
  if(!content){alert('請先貼上 OE 內容！');return;}
  var provider=cfg('ai_provider')||'gemini';
  var model=cfg('ai_model')||'gemini-2.0-flash';
  var loading=document.getElementById('ai-loading');
  loading.classList.add('show');
  try{
    var r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:provider,model:model,prompt:AI_PROMPT,content:content})});
    var data=await r.json();
    if(data.error) throw new Error(data.error);
    aiResult=parseAIResult(data.result);
    showAIPreview();
    document.getElementById('save-card-btn').style.display='inline-flex';
  }catch(e){
    var msg = e.message;
    var hint = '';
    if(msg.includes('429')) hint = '\nAPI 配額已用完，請明天再試或更換 API Key';
    else if(msg.includes('404')) hint = '\nModel 名稱錯誤，請在設定頁更新 Model 名稱';
    else if(msg.includes('API_KEY')) hint = '\nAPI Key 未設定或無效';
    else if(msg.includes('Failed to fetch')) hint = '\n網路連線失敗，請檢查網路';
    showError('AI 整理失敗' + hint);
    console.error('AI error:', msg);
  }
  loading.classList.remove('show');
}
function parseAIResult(text){
  var result={raw:text};
  for(var i=0;i<DIMS.length;i++){
    var marker='【'+DIMS[i]+'】';var start=text.indexOf(marker);
    if(start===-1){result[KEYS[i]]='';continue;}
    var cs=start+marker.length,end=text.length;
    for(var j=0;j<DIMS.length;j++){if(j===i) continue;var np=text.indexOf('【'+DIMS[j]+'】',cs);if(np!==-1&&np<end)end=np;}
    result[KEYS[i]]=text.slice(cs,end).trim();
  }
  return result;
}
function showAIPreview(){previewDim=0;document.getElementById('ai-result-preview').style.display='block';renderPreviewTabs();renderPreviewContent();}
function renderPreviewTabs(){document.getElementById('preview-dims').innerHTML=DIMS.map(function(d,i){return'<button class="dim-tab'+(i===previewDim?' active':'')+'" onclick="switchPreviewDim('+i+')">'+d+'</button>';}).join('');}
function switchPreviewDim(i){previewDim=i;renderPreviewTabs();renderPreviewContent();}
function renderPreviewContent(){document.getElementById('preview-content').innerHTML=renderMd(aiResult[KEYS[previewDim]]||'（無資料）');}

// ── Save knowledge card ──
function saveKnowledgeCard(){
  var title=document.getElementById('card-title-input').value.trim();
  if(!title){alert('請填入標題！');return;}
  var card={
    id:'local_'+Date.now(),type:'knowledge',title:title,case_number:'',
    importance:cardSelectedImp,contexts:Array.from(cardSelectedTags),
    oe_content:document.getElementById('card-oe-content').value.trim(),
    ref_links:document.getElementById('card-ref-url').value.trim(),
    diagnosis:aiResult.diagnosis||'',management:aiResult.management||'',workup:aiResult.workup||'',
    pearl:aiResult.pearl||'',keypoints:aiResult.keypoints||'',memory:aiResult.memory||'',evidence:aiResult.evidence||'',
    notes:'',linked_cards:Array.from(newCardLinkedIds),review_due:null,starred:false,view_count:0,last_viewed:null,
    auto_keywords:extractKeywords(title+' '+Object.values(aiResult).join(' ')).join(' '),
    created_at:new Date().toISOString()
  };
  allCards.unshift(card);dbSave(card);
  // 建立雙向連結
  Array.from(newCardLinkedIds).forEach(function(lid){
    var lc=allCards.find(function(c){return String(c.id)===String(lid);});
    if(lc&&!(lc.linked_cards||[]).some(function(x){return String(x)===String(card.id);})){
      (lc.linked_cards=lc.linked_cards||[]).push(String(card.id));dbSave(lc);
    }
  });
  renderKnowledgeCards();
  document.getElementById('card-title-input').value='';document.getElementById('card-oe-content').value='';document.getElementById('card-ref-url').value='';
  document.getElementById('ai-result-preview').style.display='none';document.getElementById('save-card-btn').style.display='none';
  cardSelectedTags.clear();cardSelectedImp=impLevels[0]?impLevels[0].id:'red';
  renderTagSelector('card-tag-select',cardSelectedTags,'card');renderImpSelector('card-imp-select',cardSelectedImp,'card');
  newCardLinkedIds.clear();
  var nls=document.getElementById('new-card-link-search');if(nls)nls.value='';
  var nll=document.getElementById('new-card-link-list');if(nll)nll.innerHTML='';
  aiResult={};toggleSection('newcard-sec');showToast('卡片已儲存');
}

// ── Review ──
function checkReview(){
  var now=new Date(),cutoff=new Date(now-REVIEW_DAYS*86400000);
  var due=allCards.filter(function(c){
    if(c.type==='case') return false;
    if(c.review_due&&new Date(c.review_due)<=now) return true;
    var lv=c.last_viewed?new Date(c.last_viewed):new Date(c.created_at);
    return lv<cutoff;
  });
  var b=document.getElementById('review-banner');
  if(due.length){b.style.display='flex';document.getElementById('review-text').textContent=due.length+' 張知識卡片超過 '+REVIEW_DAYS+' 天未複習，點此查看';}
  else b.style.display='none';
}
function showReviewCards(){switchTab('cards');document.getElementById('card-search').value='待複習';renderKnowledgeCards();}

function getAllFiltered(){
  var s = document.getElementById('all-search') ? document.getElementById('all-search').value.toLowerCase().trim() : '';
  return allCards.filter(function(c){
    if(filterStarred && !c.starred) return false;
    if(!s) return true;
    var searchable = [c.title, c.case_number, c.content,
      c.diagnosis, c.management, c.workup, c.pearl,
      c.keypoints, c.memory, c.evidence, c.notes, c.auto_keywords
    ].filter(Boolean).join(' ').toLowerCase();
    return s.split(/\s+/).every(function(t){ return searchable.includes(t); });
  });
}

function toggleStarFilter(tab){
  filterStarred = !filterStarred;
  var ids = ['star-filter-case','star-filter-cards','star-filter-all'];
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if(el){
      el.textContent = filterStarred ? '★' : '☆';
      el.style.color = filterStarred ? '#EF9F27' : '';
    }
  });
  if(tab==='cases') renderCases();
  else if(tab==='cards') renderKnowledgeCards();
  else renderAll();
}

function toggleStar(e,id){
  e.stopPropagation();
  // 嘗試用傳入的 id 找，也嘗試用字串比對
  var c=allCards.find(function(x){return String(x.id)===String(id);});
  if(!c) return;
  c.starred=!c.starred;
  // 立即更新按鈕外觀，不需要重新渲染整個列表
  var btn=e.currentTarget||e.target;
  while(btn&&btn.tagName!=='BUTTON') btn=btn.parentElement;
  if(btn){
    btn.className='icon-btn'+(c.starred?' starred':'');
    var icon=btn.querySelector('i');
    if(icon) icon.className='ti ti-star'+(c.starred?'-filled':'');
  }
  dbSave(c);
}

// ── Open card ──
function openCard(id){
  dimEditActive = false;
  currentCard=allCards.find(function(c){return String(c.id)===String(id);});
  if(!currentCard) return;
  currentDim=0;
  currentCard.view_count=(currentCard.view_count||0)+1;
  currentCard.last_viewed=new Date().toISOString();
  dbSave(currentCard);
  document.getElementById('vm-title').textContent=currentCard.title;
  var ctxs=Array.isArray(currentCard.contexts)?currentCard.contexts:[];
  var imp=currentCard.importance||'gray',cm=IMP_COLORS[imp]||IMP_COLORS.gray;
  var impLv=impLevels.find(function(x){return x.id===imp;});
  renderViewMeta();
  renderViewLinks();
  if(currentCard.type==='case'){
    caseEditActive = false;
    document.getElementById('vm-case-editor').style.display='none';
    document.getElementById('vm-case-area').style.display='block';
    document.getElementById('vm-card-area').style.display='none';
    document.getElementById('vm-case-content').style.display='block';
    document.getElementById('vm-case-content').innerHTML=renderMd(currentCard.content||'（無內容）');
  } else {
    document.getElementById('vm-case-area').style.display='none';
    document.getElementById('vm-card-area').style.display='block';
    renderDimTabs();renderDimContent();
  }
  document.getElementById('vm-notes').value=currentCard.notes||'';
  document.getElementById('vm-notes').style.display='block';
  document.getElementById('vm-notes-preview').style.display='none';
  document.getElementById('notes-preview-btn').textContent='預覽';showNotesPreview=false;
  var refVal=currentCard.ref_links||'';
  document.getElementById('vm-ref-area').value=refVal;
  document.getElementById('vm-ref-rendered').innerHTML=renderRefLinks(refVal);
  document.getElementById('vm-ref-area').style.display='none';
  document.getElementById('ref-edit-btn').textContent='編輯';refEditMode=false;
  document.getElementById('view-bg').style.display='flex';
}

function quickChangeImp(impId){
  if(!currentCard) return;
  currentCard.importance = impId;
  dbSave(currentCard);
  renderViewMeta();
  if(currentTab==='cases') renderCases();else renderKnowledgeCards();
  showToast('重要程度已更新');
}

function renderViewMeta(){
  if(!currentCard) return;
  var imp = currentCard.importance||'gray';
  var cm = IMP_COLORS[imp]||IMP_COLORS.gray;
  var ctxs = Array.isArray(currentCard.contexts)?currentCard.contexts:[];
  var impLv = impLevels.find(function(x){return x.id===imp;});
  // 使用 DOM 建立，避免字串引號衝突
  var meta = document.getElementById('vm-meta');
  meta.innerHTML = '';
  // 重要程度 chips
  impLevels.forEach(function(lv){
    var c2 = IMP_COLORS[lv.color]||IMP_COLORS.gray;
    var isActive = lv.id === imp;
    var span = document.createElement('span');
    span.style.cssText = isActive
      ? 'background:'+c2.bg+';color:'+c2.text+';border:0.5px solid '+c2.border+';cursor:pointer;font-size:12px;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;margin-right:4px;font-weight:500'
      : 'background:var(--bg2);color:var(--text3);border:0.5px solid var(--border);cursor:pointer;font-size:12px;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;margin-right:4px';
    span.title = '點擊切換重要程度';
    span.dataset.impId = lv.id;
    span.onclick = function(){ quickChangeImp(this.dataset.impId); };
    var dot = document.createElement('span');
    dot.style.cssText = 'width:7px;height:7px;border-radius:50%;background:'+c2.dot+';flex-shrink:0;display:inline-block';
    span.appendChild(dot);
    span.appendChild(document.createTextNode(c2.emoji+' '+lv.label));
    meta.appendChild(span);
  });
  // ctx chips
  ctxs.forEach(function(t){
    var span = document.createElement('span');
    span.className = 'chip chip-ctx';
    span.textContent = t;
    meta.appendChild(span);
  });
  // case number
  if(currentCard.case_number){
    var span = document.createElement('span');
    span.className = 'chip chip-case';
    span.textContent = currentCard.case_number;
    meta.appendChild(span);
  }
  // type badge
  var typeBadge = document.createElement('span');
  typeBadge.className = 'chip';
  if(currentCard.type==='case'){
    typeBadge.style.cssText = 'background:var(--green-bg);color:var(--green-text)';
    typeBadge.textContent = '個案';
  } else {
    typeBadge.style.cssText = 'background:var(--blue-bg);color:var(--blue-text)';
    typeBadge.textContent = '知識卡片';
  }
  meta.appendChild(typeBadge);
}


function renderViewLinks(){
  var linked=currentCard.linked_cards||[];
  var backLinks=allCards.filter(function(c){
    return String(c.id)!==String(currentCard.id)&&(c.linked_cards||[]).some(function(l){return String(l)===String(currentCard.id);})&&linked.indexOf(String(c.id))===-1;
  });
  var allLinked=linked.map(function(lid){return allCards.find(function(c){return String(c.id)===String(lid);});}).filter(Boolean).concat(backLinks);
  document.getElementById('vm-links').innerHTML=allLinked.length
    ?'<div style="font-size:11px;color:var(--text3);margin-bottom:4px"><i class="ti ti-link"></i> 連結</div>'
      +allLinked.map(function(lc){var isCase=lc.type==='case';return'<span class="chip '+(isCase?'chip-case':'chip-link')+'" style="cursor:pointer;margin-bottom:3px" onclick="openCard(\''+lc.id+'\')">'+(isCase?'<i class="ti ti-clipboard-list"></i> ':'')+lc.title+'</span> ';}).join('')
    :'';
}

// ── Case inline edit ──
var caseEditActive = false;

function startCaseEdit(){
  if(caseEditActive) return;
  if(!currentCard || currentCard.type !== 'case') return;
  caseEditActive = true;
  var raw = currentCard.content || '';
  document.getElementById('vm-case-content').style.display = 'none';
  var editor = document.getElementById('vm-case-editor');
  var ta = document.getElementById('vm-case-textarea');
  ta.value = raw;
  editor.style.display = 'block';
  ta.focus();
  ta.style.height = 'auto';
  ta.style.height = Math.max(ta.scrollHeight, 200) + 'px';
}

function caseFormat(before, after){
  var ta = document.getElementById('vm-case-textarea');
  var s = ta.selectionStart, e = ta.selectionEnd;
  var sel = ta.value.slice(s, e) || '文字';
  ta.value = ta.value.slice(0,s) + before + sel + after + ta.value.slice(e);
  ta.focus();
  ta.setSelectionRange(s + before.length, s + before.length + sel.length);
}

function saveCaseEdit(){
  if(!currentCard) return;
  var ta = document.getElementById('vm-case-textarea');
  currentCard.content = ta.value;
  currentCard.auto_keywords = extractKeywords(currentCard.title + ' ' + currentCard.content).join(' ');
  dbSave(currentCard);
  renderCases();
  closeCaseEditor();
  showToast('已儲存');
}

function cancelCaseEdit(){
  closeCaseEditor();
}

function closeCaseEditor(){
  caseEditActive = false;
  document.getElementById('vm-case-editor').style.display = 'none';
  var contentEl = document.getElementById('vm-case-content');
  contentEl.style.display = 'block';
  contentEl.innerHTML = renderMd(currentCard.content || '（無內容）');
}

function saveDimEdit(){

function cancelDimEdit(){

function closeDimEditor(){

  document.getElementById('vm-dim-content').style.display = 'block';
  renderDimContent();
}

function renderDimTabs(){document.getElementById('vm-dims').innerHTML=DIMS.map(function(d,i){return'<button class="dim-tab'+(i===currentDim?' active':'')+'" onclick="switchDim('+i+')">'+d+'</button>';}).join('');}
function switchDim(i){
  if(dimEditActive) saveDimEdit();
  currentDim=i;renderDimTabs();renderDimContent();
  dimEditActive=false;
  document.getElementById('vm-dim-editor').style.display='none';
  document.getElementById('vm-dim-content').style.display='block';
}
function prevDim(){if(currentDim>0)switchDim(currentDim-1);}
function nextDim(){if(currentDim<DIMS.length-1)switchDim(currentDim+1);}
function renderDimContent(){if(!currentCard) return;document.getElementById('vm-dim-content').innerHTML=renderMd(currentCard[KEYS[currentDim]]||'（無資料）');}
function closeView(){
  if(dimEditActive) saveDimEdit();
  if(caseEditActive) saveCaseEdit();
  dimEditActive=false;caseEditActive=false;
  document.getElementById('view-bg').style.display='none';
  checkReview();
}

// ── Notes ──
function insertNote(before,after){
  var ta=document.getElementById('vm-notes');
  var s=ta.selectionStart,e=ta.selectionEnd;
  var sel=ta.value.slice(s,e)||'文字';
  ta.value=ta.value.slice(0,s)+before+sel+after+ta.value.slice(e);
  ta.focus();ta.setSelectionRange(s+before.length,s+before.length+sel.length);autoSaveNotes();
}
function toggleNotesPreview(){
  showNotesPreview=!showNotesPreview;
  var ta=document.getElementById('vm-notes'),pv=document.getElementById('vm-notes-preview'),btn=document.getElementById('notes-preview-btn');
  if(showNotesPreview){pv.innerHTML=renderMd(ta.value);pv.style.display='block';ta.style.display='none';btn.textContent='編輯';}
  else{pv.style.display='none';ta.style.display='block';btn.textContent='預覽';ta.focus();}
}
function autoSaveNotes(){
  clearTimeout(notesTimer);
  notesTimer=setTimeout(async function(){
    if(!currentCard) return;
    currentCard.notes=document.getElementById('vm-notes').value;
    await dbSave(currentCard);
    if(currentTab==='cases') renderCases();else renderKnowledgeCards();
  },1000);
}

// ── Ref ──
function renderRefLinks(text){
  if(!text||!text.trim()) return '<span style="font-size:12px;color:var(--text3)">尚無參考來源</span>';
  return text.split('\n').filter(function(l){return l.trim();}).map(function(line){
    return '<div style="margin:3px 0;font-size:13px">'+line.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')+'</div>';
  }).join('');
}
function toggleRefEdit(){
  refEditMode=!refEditMode;
  var ra=document.getElementById('vm-ref-area'),rr=document.getElementById('vm-ref-rendered'),btn=document.getElementById('ref-edit-btn');
  if(refEditMode){rr.style.display='none';ra.style.display='block';ra.focus();btn.textContent='完成';}
  else{if(currentCard){currentCard.ref_links=ra.value;dbSave(currentCard);}rr.innerHTML=renderRefLinks(ra.value);rr.style.display='block';ra.style.display='none';btn.textContent='編輯';}
}
function autoSaveRef(){
  clearTimeout(refTimer);
  refTimer=setTimeout(function(){
    if(!currentCard) return;
    currentCard.ref_links=document.getElementById('vm-ref-area').value;
    dbSave(currentCard);document.getElementById('vm-ref-rendered').innerHTML=renderRefLinks(currentCard.ref_links);
  },1000);
}

// ── Card actions ──
async function markReview(){
  if(!currentCard) return;
  var d=new Date();d.setDate(d.getDate()+3);currentCard.review_due=d.toISOString();
  await dbSave(currentCard);checkReview();
  if(currentTab==='cases') renderCases();else renderKnowledgeCards();
  showToast('已標記！3天後提醒複習');
}
function copyCurrentCard(){
  if(!currentCard) return;
  var text=currentCard.type==='case'
    ?(currentCard.case_number?'病例號：'+currentCard.case_number+'\n\n':'')+currentCard.content
    :DIMS.map(function(d,i){return'【'+d+'】\n'+(currentCard[KEYS[i]]||'—');}).join('\n\n');
  navigator.clipboard.writeText(text).then(function(){showToast('已複製！');});
}
async function deleteCurrentCard(){
  if(!currentCard||!confirm('確定刪除「'+currentCard.title+'」？')) return;
  await dbDelete(currentCard.id);
  allCards=allCards.filter(function(c){return String(c.id)!==String(currentCard.id);});
  if(currentTab==='cases') renderCases();else renderKnowledgeCards();
  closeView();
}

// ── Edit modal ──
function editById(e,id){
  e.stopPropagation();
  currentCard=allCards.find(function(c){return String(c.id)===String(id);});
  if(currentCard) openEdit();
}
function renderNewCardLinkPicker(){
  var s = (document.getElementById('new-card-link-search').value||'').toLowerCase().trim();
  var candidates = allCards.filter(function(c){
    if(newCardLinkedIds.has(String(c.id))) return true;
    if(s) return c.title.toLowerCase().includes(s)||(c.auto_keywords||'').toLowerCase().includes(s);
    return false;
  });
  if(!s){
    var recent = allCards.filter(function(c){ return !newCardLinkedIds.has(String(c.id)); }).slice(0,5);
    candidates = candidates.concat(recent);
  }
  document.getElementById('new-card-link-list').innerHTML = candidates.length
    ? candidates.map(function(c){
        return '<label class="link-item"><input type="checkbox" value="'+c.id+'" '
          +(newCardLinkedIds.has(String(c.id))?'checked':'')
          +' onchange="toggleNewCardLink(this)"/> '
          +(c.type==='case'?'📋 ':'📚 ')+escHtml(c.title)+'</label>';
      }).join('')
    : '<p style="font-size:12px;color:var(--text2)">輸入關鍵字搜尋，或新增後自動顯示最新 5 筆</p>';
}

function toggleNewCardLink(checkbox){
  var id = checkbox.value;
  if(checkbox.checked) newCardLinkedIds.add(id);
  else newCardLinkedIds.delete(id);
}

function renderLinkPicker(){
  var s=(document.getElementById('link-search').value||'').toLowerCase().trim();
  var linked=Array.from(editLinkedIds);
  // 最新 5 張 + 搜尋結果 + 已連結的
  var candidates=allCards.filter(function(c){
    if(String(c.id)===String(currentCard.id)) return false;
    if(editLinkedIds.has(String(c.id))) return true; // 已連結永遠顯示
    if(s) return c.title.toLowerCase().includes(s)||(c.auto_keywords||'').toLowerCase().includes(s);
    return false; // 未搜尋時只顯示已連結
  });
  // 加上最新 5 張（未搜尋時）
  if(!s){
    var recent=allCards.filter(function(c){return String(c.id)!==String(currentCard.id)&&!editLinkedIds.has(String(c.id));}).slice(0,5);
    candidates=candidates.concat(recent);
  }
  document.getElementById('link-list').innerHTML=candidates.length
    ?candidates.map(function(c){
      var isLinked=editLinkedIds.has(String(c.id));
      return '<label class="link-item"><input type="checkbox" value="'+c.id+'" '+(isLinked?'checked':'')
        +' onchange="toggleLinkCheck(this)"/> '+(c.type==='case'?'📋 ':'📚 ')+escHtml(c.title)+'</label>';
    }).join('')
    :'<p style="font-size:12px;color:var(--text2)">輸入關鍵字搜尋記錄</p>';
}
function toggleLinkCheck(checkbox){
  var id=checkbox.value;
  if(checkbox.checked) editLinkedIds.add(id);else editLinkedIds.delete(id);
}
function openEdit(){
  if(!currentCard) return;
  document.getElementById('edit-title').value=currentCard.title;
  document.getElementById('edit-case-num').value=currentCard.case_number||'';
  document.getElementById('edit-ref').value=currentCard.ref_links||'';
  editSelectedImp=currentCard.importance||'gray';
  editSelectedTags=new Set(Array.isArray(currentCard.contexts)?currentCard.contexts:[]);
  editLinkedIds=new Set((currentCard.linked_cards||[]).map(String));
  renderTagSelector('edit-tags-wrap',editSelectedTags,'edit');
  renderImpSelector('edit-imp-wrap',editSelectedImp,'edit');
  document.getElementById('link-search').value='';
  renderLinkPicker();
  if(currentCard.type==='case'){
    document.getElementById('edit-fields').innerHTML='<label class="field-label">臨床記錄</label><textarea class="edit-field" id="ef-content">'+escHtml(currentCard.content||'')+'</textarea>';
  } else {
    document.getElementById('edit-fields').innerHTML=KEYS.map(function(k,i){return'<label class="field-label" style="margin-top:10px">'+DIMS[i]+'</label><textarea class="edit-field" id="ef-'+k+'">'+escHtml(currentCard[k]||'')+'</textarea>';}).join('');
  }
  document.getElementById('view-bg').style.display='none';
  document.getElementById('edit-bg').style.display='flex';
}
async function saveEdit(){
  if(!currentCard) return;
  currentCard.title=document.getElementById('edit-title').value.trim()||currentCard.title;
  currentCard.case_number=document.getElementById('edit-case-num').value.trim();
  currentCard.importance=editSelectedImp;
  currentCard.contexts=Array.from(editSelectedTags);
  currentCard.ref_links=document.getElementById('edit-ref').value;
  var newLinks=Array.from(editLinkedIds);
  var oldLinks=currentCard.linked_cards||[];
  oldLinks.forEach(function(lid){
    if(newLinks.indexOf(lid)===-1){var lc=allCards.find(function(c){return String(c.id)===String(lid);});if(lc){lc.linked_cards=(lc.linked_cards||[]).filter(function(x){return String(x)!==String(currentCard.id);});dbSave(lc);}}
  });
  newLinks.forEach(function(lid){
    var lc=allCards.find(function(c){return String(c.id)===String(lid);});
    if(lc&&!(lc.linked_cards||[]).some(function(x){return String(x)===String(currentCard.id);})){(lc.linked_cards=lc.linked_cards||[]).push(String(currentCard.id));dbSave(lc);}
  });
  currentCard.linked_cards=newLinks;
  if(currentCard.type==='case'){var ef=document.getElementById('ef-content');if(ef)currentCard.content=ef.value;}
  else{KEYS.forEach(function(k){var el=document.getElementById('ef-'+k);if(el)currentCard[k]=el.value;});currentCard.auto_keywords=extractKeywords(currentCard.title+' '+KEYS.map(function(k){return currentCard[k]||'';}).join(' ')).join(' ');}
  await dbSave(currentCard);
  if(currentTab==='cases') renderCases();else renderKnowledgeCards();
  closeEdit();showToast('已儲存');
}
function closeEdit(){document.getElementById('edit-bg').style.display='none';}

// ── Export ──
function toggleExportMenu(){
  var m=document.getElementById('export-menu');
  m.style.display=m.style.display==='none'?'block':'none';
  if(m.style.display==='block') setTimeout(function(){document.addEventListener('click',function h(){m.style.display='none';document.removeEventListener('click',h);});},50);
}
function csvEscape(val){
  if(val===null||val===undefined) return '';
  var s=String(val).replace(/"/g,'""');
  if(s.includes(',')||s.includes('"')||s.includes('\n')) return '"'+s+'"';
  return s;
}

function doExport(scope,fmt){
  document.getElementById('export-menu').style.display='none';
  var data=scope==='filtered'
    ?(currentTab==='cases'?getCasesFiltered():currentTab==='cards'?getCardsFiltered():getAllFiltered())
    :allCards;
  var fileContent,ext,mime;

  if(fmt==='csv'){
    var headers=['日期','類型','標題','病例號','標籤','重要程度','診斷','處置','Work-up','臨床價值','核心知識點','記憶法','必考延伸','臨床記錄','臨床心得','參考來源'];
    var rows=[headers.map(csvEscape).join(',')];
    data.forEach(function(c){
      var impLv=impLevels.find(function(x){return x.id===(c.importance||'gray');});
      var row=[
        (c.created_at||'').slice(0,10),
        c.type==='case'?'個案':'知識卡片',
        c.title||'',
        c.case_number||'',
        Array.isArray(c.contexts)?c.contexts.join('、'):'',
        impLv?impLv.label:'',
        c.diagnosis||'',
        c.management||'',
        c.workup||'',
        c.pearl||'',
        c.keypoints||'',
        c.memory||'',
        c.evidence||'',
        c.content||'',
        c.notes||'',
        c.ref_links||''
      ];
      rows.push(row.map(csvEscape).join(','));
    });
    fileContent='\uFEFF'+rows.join('\n');
    ext='csv';mime='text/csv;charset=utf-8';
  } else if(fmt==='json'){
    fileContent=JSON.stringify(data,null,2);ext='json';mime='text/plain;charset=utf-8';
  } else {
    fileContent=data.map(function(c){
      var base='# '+(c.type==='case'?'[個案] ':'')+c.title+(c.case_number?' ['+c.case_number+']':'')+'\n\n';
      if(c.type==='case'){
        return base+(c.content||'')+(c.notes?'\n\n## 臨床心得\n'+c.notes:'')+'\n\n---\n';
      }
      return base+'**標籤：** '+(Array.isArray(c.contexts)?c.contexts.join(', '):'—')+'\n\n'
        +DIMS.map(function(d,i){return'## '+d+'\n\n'+(c[KEYS[i]]||'—');}).join('\n\n')
        +(c.notes?'\n\n## 臨床心得\n\n'+c.notes:'')
        +(c.ref_links?'\n\n## 參考來源\n\n'+c.ref_links:'')+'\n\n---\n';
    }).join('\n');ext='md';mime='text/plain;charset=utf-8';
  }

  var blob=new Blob([fileContent],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  a.download='clinical_'+new Date().toISOString().slice(0,10)+'.'+ext;
  a.click();URL.revokeObjectURL(url);
  showToast('匯出完成');
}
