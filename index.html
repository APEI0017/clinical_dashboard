<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>臨床知識看板</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#fff; --bg2:#f8f8f7; --bg3:#f1f0eb;
  --text:#1a1a1a; --text2:#6b6b6b; --text3:#9b9b9b;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.15);
  --blue:#185FA5; --blue-dark:#0C447C; --blue-bg:#E6F1FB; --blue-text:#0C447C;
  --green:#1A7C4A; --green-bg:#E1F5EE; --green-text:#085041;
  --amber:#BA7517; --amber-bg:#FAEEDA; --amber-text:#633806;
  --red:#A32D2D; --red-bg:#FCEBEB;
  --purple:#3C3489; --purple-bg:#EEEDFE;
  --radius:8px; --radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
input,select,textarea,button{font-family:'Inter',sans-serif}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Layout ── */
.app{max-width:1100px;margin:0 auto;padding:1.5rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
.header-right{display:flex;gap:8px;align-items:center}
.user-chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);background:var(--bg);border:0.5px solid var(--border2);padding:5px 10px;border-radius:20px;cursor:pointer}
.user-chip img{width:20px;height:20px;border-radius:50%}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.conn-dot.ok{background:#22c55e}.conn-dot.err{background:var(--red)}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;margin-bottom:1.25rem;background:var(--bg);border-radius:var(--radius-lg);padding:4px;border:0.5px solid var(--border);box-shadow:var(--shadow)}
.tab{flex:1;text-align:center;padding:8px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);transition:all .15s}
.tab.active{background:var(--blue);color:#fff}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;white-space:nowrap;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark)}
.btn-outline{background:none;border:0.5px solid var(--border2);color:var(--text2)}.btn-outline:hover{background:var(--bg2)}
.btn-ghost{background:none;border:none;color:var(--text2);padding:4px 8px}.btn-ghost:hover{background:var(--bg2)}
.btn-danger{background:none;border:0.5px solid var(--red);color:var(--red)}.btn-danger:hover{background:var(--red-bg)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{filter:brightness(.9)}
.btn-sm{padding:5px 10px;font-size:12px}

/* ── Section accordion ── */
.section{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:.75rem;overflow:hidden;box-shadow:var(--shadow)}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.25rem;cursor:pointer;user-select:none}
.section-hd:hover{background:var(--bg2)}
.section-hd-left{display:flex;align-items:center;gap:10px}
.section-title{font-size:14px;font-weight:500}
.section-sub{font-size:12px;color:var(--text3)}
.chevron{font-size:16px;color:var(--text3);transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.section-bd{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .2s;padding:0 1.25rem}
.section-bd.open{max-height:5000px;padding:0 1.25rem 1.25rem}

/* ── Forms ── */
.field-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:5px}
.plain-input{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
.plain-input:focus{border-color:var(--blue)}
.textarea{width:100%;font-size:13px;padding:10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);resize:vertical;min-height:80px;outline:none;line-height:1.7}
.textarea:focus{border-color:var(--blue)}
.textarea-auto{resize:none;overflow:hidden;min-height:36px;max-height:400px}

/* ── Tags ── */
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;user-select:none;transition:all .15s}
.tag:hover{border-color:var(--blue);color:var(--blue)}
.tag.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tag.dragging{opacity:.4}
.tag.drag-over{border-color:var(--blue);transform:scale(1.05)}
.tag-add{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px dashed var(--border2);color:var(--text3);cursor:pointer;background:none}
.tag-add:hover{border-color:var(--blue);color:var(--blue)}
.tag-edit-input{font-size:12px;padding:3px 8px;border:0.5px solid var(--blue);border-radius:20px;outline:none;width:90px;background:var(--bg)}

/* ── Importance dots ── */
.imp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}

/* ── Quick bar ── */
.quick-bar{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:.75rem 1rem;margin-bottom:.75rem;display:flex;gap:8px;align-items:flex-end;box-shadow:var(--shadow)}

/* ── Cards grid ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;cursor:pointer;transition:all .15s;position:relative;box-shadow:var(--shadow)}
.card:hover{border-color:var(--border2);box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.card.draft{border-style:dashed;border-color:var(--amber)}
.card.imp-red{border-left:3px solid var(--red)}
.card.imp-amber{border-left:3px solid var(--amber)}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;gap:8px}
.card-title{font-size:14px;font-weight:500;line-height:1.4;flex:1}
.card-actions{display:flex;gap:2px;flex-shrink:0}
.icon-btn{font-size:15px;cursor:pointer;color:var(--text3);background:none;border:none;padding:3px;line-height:1;border-radius:var(--radius)}
.icon-btn:hover{color:var(--text);background:var(--bg2)}
.icon-btn.starred{color:#EF9F27}
.card-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.chip{font-size:11px;padding:2px 7px;border-radius:20px}
.chip-ctx{background:var(--bg2);color:var(--text2);border:0.5px solid var(--border)}
.chip-case{background:var(--purple-bg);color:var(--purple);font-family:monospace}
.chip-imp{font-size:10px;color:var(--text3)}
.chip-link{background:var(--purple-bg);color:var(--purple);border:0.5px solid var(--purple);cursor:pointer}
.card-preview{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{font-size:11px;color:var(--text3);margin-top:7px;display:flex;align-items:center;justify-content:space-between}
.review-badge{position:absolute;top:10px;right:10px;font-size:10px;background:var(--amber-bg);color:var(--amber-text);padding:2px 7px;border-radius:20px;font-weight:500}
.draft-badge{font-size:10px;background:var(--amber-bg);color:var(--amber-text);padding:2px 7px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:3px;margin-bottom:4px}

/* ── Review banner ── */
.review-banner{background:var(--amber-bg);border:0.5px solid var(--amber);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:.75rem;display:flex;align-items:center;gap:10px;cursor:pointer}
.review-banner p{font-size:13px;color:var(--amber-text);flex:1}

/* ── Top bar ── */
.top-bar{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text3);pointer-events:none}
.search-input{width:100%;padding:8px 10px 8px 32px;font-size:13px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
.search-input:focus{border-color:var(--blue)}

/* ── Empty state ── */
.empty-state{text-align:center;padding:4rem 1rem;color:var(--text3)}
.empty-state i{font-size:36px;display:block;margin-bottom:10px}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--bg);border-radius:var(--radius-lg);width:100%;max-width:780px;padding:1.5rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius)}
.modal-close:hover{background:var(--bg2)}
.modal h2{font-size:17px;font-weight:600;margin-bottom:.5rem;padding-right:2rem;line-height:1.3}

/* ── Dim tabs ── */
.dim-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:1rem 0 .75rem}
.dim-tab{font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .15s}
.dim-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.dim-nav{display:flex;gap:6px;margin-bottom:6px}
.dim-nav-btn{background:none;border:0.5px solid var(--border2);padding:3px 10px;border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--text2)}
.dim-nav-btn:hover{background:var(--bg2)}

/* ── Content area (dim + case notes) ── */
.content-area{background:var(--bg2);border-radius:var(--radius);padding:1rem;min-height:120px;font-size:13px;line-height:1.9;position:relative}
.content-area strong{font-weight:600}
.content-area em{font-style:italic}
.content-area mark{background:#FFF176;padding:0 2px;border-radius:2px}
.content-area code{background:var(--bg3);padding:1px 4px;border-radius:3px;font-family:monospace;font-size:12px}
.content-area pre{background:var(--bg3);padding:8px 10px;border-radius:var(--radius);font-family:monospace;font-size:12px;overflow-x:auto;margin:4px 0;white-space:pre-wrap}
.content-area table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.content-area th{background:var(--bg3);font-weight:600;padding:4px 8px;border:0.5px solid var(--border2)}
.content-area td{padding:4px 8px;border:0.5px solid var(--border2)}
.content-area .cb{display:flex;align-items:center;gap:6px;margin:2px 0}
.content-area h1{font-size:15px;font-weight:600;margin:10px 0 4px}
.content-area h2{font-size:13px;font-weight:600;margin:10px 0 3px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.content-area h3{font-size:12px;font-weight:600;color:var(--text2);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.3px}
.source-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:var(--radius);margin-left:3px;font-weight:500}
.badge-orig{background:var(--green-bg);color:var(--green-text)}
.badge-ai{background:var(--blue-bg);color:var(--blue-text)}

/* ── Floating toolbar (selection) ── */
.float-toolbar{position:fixed;z-index:200;background:var(--text);border-radius:var(--radius);padding:4px 6px;display:flex;gap:2px;box-shadow:0 4px 12px rgba(0,0,0,.2);pointer-events:auto}
.float-toolbar button{background:none;border:none;color:#fff;cursor:pointer;padding:4px 7px;border-radius:5px;font-size:13px;font-weight:500;transition:background .15s}
.float-toolbar button:hover{background:rgba(255,255,255,.15)}

/* ── Notes ── */
.notes-section{margin-top:1rem}
.notes-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.notes-toolbar{display:flex;gap:4px;margin-bottom:4px}
.notes-tool{background:none;border:0.5px solid var(--border2);padding:3px 8px;border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--text2)}
.notes-tool:hover{background:var(--bg2)}
.notes-preview{background:var(--bg2);border-radius:var(--radius);padding:10px;font-size:13px;line-height:1.9;min-height:60px;display:none}
.notes-preview strong{font-weight:600}
.notes-preview em{font-style:italic}
.notes-preview mark{background:#FFF176;padding:0 2px;border-radius:2px}

/* ── Ref links ── */
.ref-section{margin-top:1rem}
.ref-label{font-size:12px;font-weight:500;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.ref-rendered a{color:var(--blue);word-break:break-all}
.ref-rendered div{font-size:13px;margin:3px 0;line-height:1.7}

/* ── Edit fields ── */
.edit-field{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);resize:vertical;min-height:80px;outline:none;line-height:1.6;margin-bottom:4px}
.edit-field:focus{border-color:var(--blue)}
.link-picker{background:var(--bg2);border-radius:var(--radius);padding:.75rem;max-height:180px;overflow-y:auto;margin-top:4px}
.link-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}

/* ── AI loading ── */
.ai-loading{display:none;align-items:center;gap:8px;font-size:13px;color:var(--text2);padding:8px 0}
.ai-loading.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Settings ── */
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{width:100%;font-size:13px;padding:7px 36px 7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
.pw-toggle{position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);padding:0}
.select-input{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none;cursor:pointer}

/* ── Export ── */
.export-wrap{position:relative}
.export-menu{position:absolute;right:0;top:calc(100%+4px);background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);z-index:10;min-width:200px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.export-menu button{display:block;width:100%;text-align:left;padding:9px 14px;font-size:13px;background:none;border:none;cursor:pointer;color:var(--text);font-family:'Inter',sans-serif}
.export-menu button:hover{background:var(--bg2)}

/* ── Login screen ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg3)}
.login-card{background:var(--bg);border-radius:var(--radius-lg);padding:3rem;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.08);max-width:400px;width:90%}
.login-card h1{font-size:22px;font-weight:600;margin-bottom:8px}
.login-card p{font-size:14px;color:var(--text2);margin-bottom:2rem;line-height:1.6}
.google-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);cursor:pointer;font-size:14px;font-weight:500;color:var(--text);transition:all .15s;width:100%;justify-content:center}
.google-btn:hover{background:var(--bg2);border-color:var(--border2)}
.google-btn svg{flex-shrink:0}

/* ── Float panel ── */
.float-panel{position:fixed;z-index:200;background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius);padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:200px}
</style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen" class="login-screen" style="display:none">
  <div class="login-card">
    <i class="ti ti-stethoscope" style="font-size:40px;color:var(--blue);display:block;margin-bottom:12px"></i>
    <h1>臨床知識看板</h1>
    <p>個案記錄 · 知識卡片 · 智慧複習<br>專為住院醫師設計的學習系統</p>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
      </svg>
      使用 Google 帳號登入
    </button>
  </div>
</div>

<!-- Main app -->
<div id="main-app" style="display:none">
<div class="app">

  <!-- Header -->
  <div class="header">
    <div>
      <h1><i class="ti ti-stethoscope" style="margin-right:6px;color:var(--blue)"></i>臨床知識看板</h1>
    </div>
    <div class="header-right">
      <span style="font-size:12px;color:var(--text2)">
        <span class="conn-dot ok" id="conn-dot"></span><span id="conn-text">已連線</span>
      </span>
      <div class="export-wrap">
        <button class="btn btn-ghost btn-sm" onclick="toggleExportMenu()"><i class="ti ti-download"></i></button>
        <div class="export-menu" id="export-menu" style="display:none">
          <button onclick="doExport('all','json')"><i class="ti ti-file-type-js"></i> 全部（JSON）</button>
          <button onclick="doExport('all','md')"><i class="ti ti-markdown"></i> 全部（Markdown）</button>
          <button onclick="doExport('filtered','json')"><i class="ti ti-filter"></i> 篩選結果（JSON）</button>
          <button onclick="doExport('filtered','md')"><i class="ti ti-filter"></i> 篩選結果（MD）</button>
        </div>
      </div>
      <div class="user-chip" onclick="toggleSection('settings-sec')">
        <img id="user-avatar" src="" style="display:none">
        <i class="ti ti-user" id="user-icon"></i>
        <span id="user-name">設定</span>
      </div>
    </div>
  </div>

  <!-- Review banner -->
  <div id="review-banner" class="review-banner" style="display:none" onclick="showReviewCards()">
    <i class="ti ti-bell" style="font-size:18px;color:var(--amber)"></i>
    <p id="review-text"></p>
    <i class="ti ti-chevron-right" style="color:var(--amber-text)"></i>
  </div>

  <!-- Settings -->
  <div class="section" id="settings-sec">
    <div class="section-hd" onclick="toggleSection('settings-sec')">
      <div class="section-hd-left">
        <i class="ti ti-settings" style="color:var(--text3)"></i>
        <span class="section-title">設定</span>
      </div>
      <i class="ti ti-chevron-down chevron" id="settings-sec-chevron"></i>
    </div>
    <div class="section-bd" id="settings-sec-body">
      <div style="padding-bottom:1rem">
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:140px">
            <label class="field-label">AI 供應商</label>
            <select class="select-input" id="ai-provider" onchange="updateModelPlaceholder()">
              <option value="gemini">Gemini（Google）</option>
              <option value="claude">Claude（Anthropic）</option>
              <option value="openai">OpenAI</option>
            </select>
          </div>

var AI_PROMPT = `⚠️ 輸出格式規定（必須嚴格遵守）：

內容：`;

// ═══════════════════════════════════════

function cfg(k){ return localStorage.getItem(k)||''; }
function setCfg(k,v){ localStorage.setItem(k,v); }
function loadTags(){ var s=cfg('tags_v2'); if(s) tags=JSON.parse(s); }
function saveTags(){ setCfg('tags_v2', JSON.stringify(tags)); }
function loadImpLevels(){ var s=cfg('imp_v2'); if(s) impLevels=JSON.parse(s); }
function saveImpLevels(){ setCfg('imp_v2', JSON.stringify(impLevels)); }

// ═══════════════════════════════════════
// SUPABASE
// ═══════════════════════════════════════
var supabase = null;

function initSupabase(){
  var url = cfg('sb_url'), key = cfg('sb_key');
  if(!url||!key) return false;
  SB_URL = url.replace(/\/$/,'');
  SB_KEY = key;
  return true;
}

async function sbFetch(path, opts){
  opts = opts||{};
  var headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + (currentUser ? currentUser.access_token : SB_KEY),
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
  Object.assign(headers, opts.headers||{});
  var r = await fetch(SB_URL+'/rest/v1/'+path, {
    headers: headers,
    method: opts.method||'GET',
    body: opts.body
  });
  if(!r.ok){ var t=await r.text(); throw new Error(t); }
  var ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.text();
}

// ═══════════════════════════════════════
// AUTH (Google OAuth via Supabase)
// ═══════════════════════════════════════
function signInWithGoogle(){
  var url = SB_URL + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(window.location.href);
  window.location.href = url;
}

function signOut(){
  setCfg('auth_token','');
  setCfg('auth_user','');
  currentUser = null;
  showLogin();
}

function handleAuthCallback(){
  // Supabase OAuth callback 會把 token 放在 URL hash
  var hash = window.location.hash;
  if(hash && hash.includes('access_token')){
    var params = new URLSearchParams(hash.slice(1));
    var token = params.get('access_token');
    var userStr = params.get('user') || '';
    if(token){
      setCfg('auth_token', token);
      // 清除 URL hash
      history.replaceState(null,'',window.location.pathname);
      currentUser = {access_token: token};
      // 取得 user info
      fetchUserInfo(token);
      return true;
    }
  }
  // 嘗試從 localStorage 讀取
  var savedToken = cfg('auth_token');
  if(savedToken){
    currentUser = {access_token: savedToken};
    fetchUserInfo(savedToken);
    return true;
  }
  return false;
}

async function fetchUserInfo(token){
  try{
    var r = await fetch(SB_URL+'/auth/v1/user', {
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer '+token}
    });
    if(r.ok){
      var u = await r.json();
      currentUser = {access_token: token, ...u};
      var name = u.user_metadata?.full_name || u.email || '已登入';
      var avatar = u.user_metadata?.avatar_url || '';
      document.getElementById('user-name').textContent = name;
      if(avatar){
        var img = document.getElementById('user-avatar');
        img.src = avatar; img.style.display='block';
        document.getElementById('user-icon').style.display='none';
      }
      showApp();
    } else {
      // token 可能過期
      setCfg('auth_token','');
      showLogin();
    }
  } catch(e){
    showApp(); // offline mode
  }
}

function showLogin(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('main-app').style.display='none';
}

function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-app').style.display='block';
  initApp();
}

function esc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ═══════════════════════════════════════
// MARKDOWN RENDERER
// ═══════════════════════════════════════
function renderMd(text){
  if(!text) return '';
  text = text
    .replace(/\[原文\]/g,'__ORIG__')
    .replace(/\[AI補充([^\]]*)\]/g,'__AI__$1__AIEND__');
  text = text.replace(/\n{3,}/g,'\n\n');
  var lines = text.split('\n');
  var html = [];
  var inCode = false;
  var inTable = false;
  var inImplicit = false;

  for(var i=0;i<lines.length;i++){
    var line = lines[i];
    var tr = line.trim();

    if(tr.startsWith('```')){
      inImplicit=false;
      if(!inCode){html.push('<pre><code>');inCode=true;}
      else{html.push('</code></pre>');inCode=false;}
      continue;
    }
    if(inCode){html.push(escHtml(line)+'\n');continue;}

    if(line.includes('|')&&tr.startsWith('|')){
      inImplicit=false;
      if(!inTable){html.push('<table>');inTable=true;}
      if(tr.includes('---')){continue;}
      var cells=tr.replace(/^\||\|$/g,'').split('|');
      var isHdr=i===0||(lines[i+1]&&lines[i+1].includes('---'));
      var tg=isHdr?'th':'td';
      html.push('<tr>'+cells.map(function(c){return'<'+tg+'>'+inlineMd(c.trim())+'</'+tg+'>';}).join('')+'</tr>');
      continue;
    } else if(inTable){html.push('</table>');inTable=false;}

    if(/^### /.test(line)){inImplicit=false;html.push('<h3>'+inlineMd(line.slice(4))+'</h3>');continue;}
    if(/^## /.test(line)) {inImplicit=false;html.push('<h2>'+inlineMd(line.slice(3))+'</h2>');continue;}
    if(/^# /.test(line))  {inImplicit=false;html.push('<h1>'+inlineMd(line.slice(2))+'</h1>');continue;}

    if(/^- \[( |x)\] /.test(line)){
      inImplicit=false;
      var checked=line[3]==='x';
      html.push('<div class="cb"><input type="checkbox"'+(checked?' checked':'')+' onclick="return false"> '+inlineMd(line.slice(6))+'</div>');
      continue;
    }
    if(/^- /.test(line)){
      inImplicit=false;
      html.push('<div style="display:flex;gap:6px;margin:2px 0"><span style="color:var(--blue);flex-shrink:0">•</span><span>'+inlineMd(line.slice(2))+'</span></div>');
      continue;
    }
    if(/^ {2,}- /.test(line)){
      inImplicit=false;
      var depth=line.match(/^ +/)[0].length;
      html.push('<div style="display:flex;gap:6px;margin:2px 0;padding-left:'+Math.min(depth*6,24)+'px"><span style="color:var(--text3);flex-shrink:0">◦</span><span>'+inlineMd(tr.slice(2))+'</span></div>');
      continue;
    }
    if(/^\d+\. /.test(line)){
      inImplicit=false;
      var m2=line.match(/^(\d+)\. (.*)/);
      if(m2){html.push('<div style="display:flex;gap:6px;margin:2px 0"><span style="color:var(--blue);font-weight:500;flex-shrink:0">'+m2[1]+'.</span><span>'+inlineMd(m2[2])+'</span></div>');continue;}
    }

    if(tr===''){inImplicit=false;html.push('<div style="height:6px"></div>');continue;}

    // implicit list detection
    var next=lines[i+1]?lines[i+1].trim():'';
    var isShort=tr.length<80;
    var nextShort=next.length>0&&next.length<80&&!next.startsWith('#')&&!next.startsWith('-')&&!/^\d+\./.test(next);
    var endsPunct=/[。.！!？?：:」』）)》]$/.test(tr);
    if(isShort&&!endsPunct&&(inImplicit||nextShort)){
      inImplicit=true;
      html.push('<div style="display:flex;gap:6px;margin:2px 0"><span style="color:var(--text3);flex-shrink:0">–</span><span>'+inlineMd(tr)+'</span></div>');
    } else {
      inImplicit=false;
      html.push('<p style="margin:3px 0;line-height:1.8">'+inlineMd(tr)+'</p>');
    }
  }
  if(inTable) html.push('</table>');
  if(inCode) html.push('</code></pre>');

  var result=html.join('');
  result=result
    .replace(/__ORIG__/g,'<span class="source-badge badge-orig">原文</span>')
    .replace(/__AI__(.*?)__AIEND__/g,'<span class="source-badge badge-ai">AI補充$1</span>');
  return result;
}

function inlineMd(text){
  return text
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/==(.+?)==/g,'<mark>$1</mark>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/(https?:\/\/[^\s<>"]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// SELECTION TOOLBAR
// ═══════════════════════════════════════
function setupSelectionToolbar(){
  document.addEventListener('mouseup', function(e){
    var toolbar = document.getElementById('float-toolbar');
    if(toolbar.contains(e.target)) return;

    var sel = window.getSelection();
    if(!sel || sel.isCollapsed || !sel.toString().trim()){
      toolbar.style.display='none';
      return;
    }
    // 只在 content-area 或 notes-area 內顯示
    var range = sel.getRangeAt(0);
    var container = range.commonAncestorContainer;
    var inContent = false;
    var el = container.nodeType===3 ? container.parentElement : container;
    while(el){
      if(el.classList && (el.classList.contains('content-area')||el.classList.contains('notes-preview'))){
        inContent=true; activeContentEl=el; break;
      }
      el=el.parentElement;
    }
    if(!inContent){toolbar.style.display='none';return;}

    var rect = range.getBoundingClientRect();
    toolbar.style.left = (rect.left + rect.width/2 - 80) + 'px';
    toolbar.style.top = (rect.top + window.scrollY - 44) + 'px';
    toolbar.style.display = 'flex';
  });

  document.addEventListener('mousedown', function(e){
    var toolbar = document.getElementById('float-toolbar');
    if(!toolbar.contains(e.target)) toolbar.style.display='none';
  });
}

function applyFormat(type){
  var sel = window.getSelection();
  if(!sel||sel.isCollapsed) return;
  var text = sel.toString();
  var formatted;
  if(type==='bold') formatted='**'+text+'**';
  else if(type==='highlight') formatted='=='+text+'==';
  else if(type==='italic') formatted='*'+text+'*';
  else if(type==='link'){
    var url=prompt('輸入連結 URL：','https://');
    if(!url) return;
    formatted='['+text+']('+url+')';
  } else return;

  // 如果選取在筆記 textarea 就直接插入
  var notesArea=document.getElementById('vm-notes');
  if(document.activeElement===notesArea){
    var s=notesArea.selectionStart,e=notesArea.selectionEnd;
    notesArea.value=notesArea.value.slice(0,s)+formatted+notesArea.value.slice(e);
    notesArea.focus();
    notesArea.setSelectionRange(s,s+formatted.length);
    autoSaveNotes();
  } else {
    // 在 rendered content 上：記錄標記到 notes
    var existing=document.getElementById('vm-notes').value;
    var note='\n[標記] '+formatted;
    document.getElementById('vm-notes').value=existing+note;
    autoSaveNotes();
    // 視覺反饋
    var range=sel.getRangeAt(0);
    var span=document.createElement('span');
    if(type==='bold') span.style.fontWeight='600';
    else if(type==='highlight') span.style.cssText='background:#FFF176;padding:0 2px;border-radius:2px';
    else if(type==='italic') span.style.fontStyle='italic';
    try{range.surroundContents(span);}catch(e){}
  }
  document.getElementById('float-toolbar').style.display='none';
}

function renderAllTagSelectors(){

function renderTagSelector(wrapId, selectedSet, prefix){
  var wrap=document.getElementById(wrapId);
  if(!wrap) return;
  wrap.innerHTML=tags.map(function(t){
    var active=selectedSet.has(t)?' active':'';
    var isDef=DEFAULT_TAGS.indexOf(t)!==-1;
    return '<span class="tag'+active+'" draggable="true"'
      +' onclick="toggleTagSel(\''+esc(t)+'\',\''+prefix+'\')"'
      +' ondblclick="editTagStart(event,\''+esc(t)+'\')"'
      +' ondragstart="tagDragStart(event,\''+esc(t)+'\')"'
      +' ondragover="tagDragOver(event)"'
      +' ondrop="tagDrop(event,\''+esc(t)+'\')"'
      +' ondragleave="this.classList.remove(\'drag-over\')"'
      +' ondragend="tagDragEnd()"'
      +' title="雙擊編輯・拖動排序">'+t
      +(!isDef?'<span onclick="removeTag(event,\''+esc(t)+'\')" style="margin-left:4px;opacity:.5;font-size:10px">×</span>':'')
      +'</span>';
  }).join('')+'<button class="tag-add" onclick="tagAddStart(\''+wrapId+'\')"><i class="ti ti-plus" style="font-size:11px"></i> 新增</button>';
}

function renderFilterTags(wrapId, filterSet, prefix){
  var wrap=document.getElementById(wrapId);
  if(!wrap) return;
  wrap.innerHTML=tags.map(function(t){
    return '<span class="tag'+(filterSet.has(t)?' active':'')+'"'
      +' style="font-size:12px"'

function renderImpSelector(wrapId, curVal, prefix){
  var wrap=document.getElementById(wrapId);
  if(!wrap) return;
  wrap.innerHTML=impLevels.map(function(lv){
    var cm=IMP_COLORS[lv.color]||IMP_COLORS.gray;
    var isActive=lv.id===curVal;
    var style=isActive?'background:'+cm.bg+';color:'+cm.text+';border-color:'+cm.border+';':'';
    return '<span class="tag" data-imp-id="'+lv.id+'" data-imp-prefix="'+prefix+'"'
      +' style="'+style+'"'
      +' onclick="selectImp(this)"'

function toggleTagSel(t, prefix){
  var s = prefix==='case'?caseSelectedTags:prefix==='card'?cardSelectedTags:editSelectedTags;
  s.has(t)?s.delete(t):s.add(t);

function toggleFilterTag(t, prefix){
  var f=prefix==='case'?filterCaseTags:filterCardTags;

function selectImp(el){
  var id=el.dataset.impId, prefix=el.dataset.impPrefix;

// Tag drag
function tagDragStart(e,t){dragSrcTag=t;setTimeout(function(){if(e.target)e.target.classList.add('dragging');},0);e.dataTransfer.effectAllowed='move';}
function tagDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function tagDragEnd(){document.querySelectorAll('.tag').forEach(function(el){el.classList.remove('dragging','drag-over');});}
function tagDrop(e,target){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(!dragSrcTag||dragSrcTag===target) return;
  var fi=tags.indexOf(dragSrcTag),ti=tags.indexOf(target);
  if(fi===-1||ti===-1) return;
  tags.splice(fi,1);tags.splice(ti,0,dragSrcTag);
  dragSrcTag=null;saveTags();renderAllTagSelectors();
}

function editTagStart(e,t){
  e.stopPropagation();
  var span=e.currentTarget;
  var inp=document.createElement('input');
  inp.className='tag-edit-input';inp.value=t;
  inp.onclick=function(ev){ev.stopPropagation();};
  inp.onblur=function(){commitEditTag(t,inp.value.trim());};
  inp.onkeydown=function(ev){if(ev.key==='Enter')inp.blur();if(ev.key==='Escape')renderAllTagSelectors();};
  span.parentNode.replaceChild(inp,span);inp.focus();inp.select();
}
function commitEditTag(old,nv){
  if(!nv||nv===old){renderAllTagSelectors();return;}
  var idx=tags.indexOf(old);if(idx!==-1)tags[idx]=nv;
  [caseSelectedTags,cardSelectedTags,editSelectedTags,filterCaseTags,filterCardTags].forEach(function(s){
    if(s.has(old)){s.delete(old);s.add(nv);}
  });
  saveTags();renderAllTagSelectors();
}
function removeTag(e,t){
  e.stopPropagation();
  if(!confirm('刪除標籤「'+t+'」？')) return;
  tags=tags.filter(function(x){return x!==t;});
  [caseSelectedTags,cardSelectedTags,editSelectedTags,filterCaseTags,filterCardTags].forEach(function(s){s.delete(t);});
  saveTags();renderAllTagSelectors();
}
function tagAddStart(wrapId){
  var wrap=document.getElementById(wrapId);
  var btn=wrap.querySelector('.tag-add');if(!btn)return;
  var inp=document.createElement('input');
  inp.className='tag-edit-input';inp.placeholder='新標籤…';
  inp.onblur=function(){commitAddTag(inp.value.trim());};
  inp.onkeydown=function(ev){if(ev.key==='Enter')inp.blur();if(ev.key==='Escape')renderAllTagSelectors();};
  btn.parentNode.replaceChild(inp,btn);inp.focus();
}
function commitAddTag(v){
  if(v&&tags.indexOf(v)===-1){tags.push(v);saveTags();}
  renderAllTagSelectors();
}

// KEYWORDS
// ═══════════════════════════════════════
function extractKeywords(text){
  if(!text) return [];
  var en=(text.match(/[A-Za-z]{3,}/g)||[]);
  var zh=(text.match(/[\u4e00-\u9fa5]{2,4}/g)||[]);
  var abbr=(text.match(/[A-Z]{2,6}/g)||[]);
  var stop={the:1,and:1,for:1,with:1,from:1,that:1,this:1,have:1,been:1,will:1,are:1,was:1,were:1,has:1,had:1,not:1,but:1,can:1,may:1,per:1,via:1,its:1,you:1,our:1,all:1};
  var all={};
  en.forEach(function(w){if(!stop[w.toLowerCase()]&&w.length>=3)all[w]=1;});
  abbr.forEach(function(w){all[w]=1;});
  zh.forEach(function(w){all[w]=1;});
  return Object.keys(all).slice(0,20);
}

function detectCaseNumber(text){
  var m=text.match(/(?:^|[\s,;])(\d{7,8})(?:[\s,;]|$)/);
  return m?m[1]:'';
}

function saveCase(){
  var title=document.getElementById('case-title').value.trim();
  var content=document.getElementById('case-content').value.trim();
  var caseNum=document.getElementById('case-number-input').value.trim();
  if(!title){alert('請填入標題！');return;}
  var detectedNum=caseNum||detectCaseNumber(content);
  var card={
    id:'local_'+Date.now(),
    type:'case',
    title:title,

// AI ORGANIZE
// ═══════════════════════════════════════
async function aiOrganize(){
  var content=document.getElementById('card-oe-content').value.trim();
  if(!content){alert('請先貼上 OE 內容！');return;}
  var provider=cfg('ai_provider')||'gemini';
  var model=cfg('ai_model')||'gemini-1.5-flash';
  var loading=document.getElementById('ai-loading');
  loading.classList.add('show');
  document.getElementById('ai-loading-text').textContent='AI 整理中…';
  try{
    var r=await fetch('/api/ai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({provider:provider,model:model,prompt:AI_PROMPT,content:content})
    });
    var data=await r.json();
    if(data.error) throw new Error(data.error);
    aiResult=parseAIResult(data.result);
    showAIPreview();
    document.getElementById('save-card-btn').style.display='inline-flex';
  } catch(e){
    alert('AI 整理失敗：'+e.message);
  }
  loading.classList.remove('show');
}

function parseAIResult(text){
  var result={raw:text};
  for(var i=0;i<DIMS.length;i++){
    var marker='【'+DIMS[i]+'】';
    var start=text.indexOf(marker);
    if(start===-1){result[KEYS[i]]='';continue;}
    var cs=start+marker.length;
    var end=text.length;
    for(var j=0;j<DIMS.length;j++){
      if(j===i) continue;
      var np=text.indexOf('【'+DIMS[j]+'】',cs);
      if(np!==-1&&np<end) end=np;
    }
    result[KEYS[i]]=text.slice(cs,end).trim();
  }
  return result;
}

function checkReview(){
  var now=new Date();
  var cutoff=new Date(now-REVIEW_DAYS*86400000);
  var due=allCards.filter(function(c){
    if(c.type==='case') return false;
    if(c.review_due&&new Date(c.review_due)<=now) return true;
    var lv=c.last_viewed?new Date(c.last_viewed):new Date(c.created_at);
    return lv<cutoff;
  });
  var b=document.getElementById('review-banner');
  if(due.length){

    document.getElementById('review-text').textContent=due.length+' 張知識卡片超過 '+REVIEW_DAYS+' 天未複習，點此查看';

function getCasesFiltered(){

    if(s){

function openCard(id){

  currentDim=0;

  dbSave(currentCard);

  document.getElementById('vm-title').textContent=currentCard.title;
  var ctxs=Array.isArray(currentCard.contexts)?currentCard.contexts:[];
  var imp=currentCard.importance||'gray';
  var cm=IMP_COLORS[imp]||IMP_COLORS.gray;
  var impLv=impLevels.find(function(x){return x.id===imp;});
  var impLabel=impLv?cm.emoji+' '+impLv.label:'';

  document.getElementById('vm-meta').innerHTML=
    '<span style="font-size:12px">'+impLabel+'</span>'
    +ctxs.map(function(t){return'<span class="chip chip-ctx">'+t+'</span>';}).join('')
    +(currentCard.case_number?'<span class="chip chip-case">'+currentCard.case_number+'</span>':'')
    +(currentCard.type==='case'?'<span class="chip" style="background:var(--green-bg);color:var(--green-text)">個案</span>':'<span class="chip" style="background:var(--blue-bg);color:var(--blue-text)">知識卡片</span>');

  // 連結
  renderViewLinks();

  if(currentCard.type==='case'){
    document.getElementById('vm-case-area').style.display='block';
    document.getElementById('vm-card-area').style.display='none';
    document.getElementById('vm-case-content').innerHTML=renderMd(currentCard.content||'（無內容）');
  } else {
    document.getElementById('vm-case-area').style.display='none';
    document.getElementById('vm-card-area').style.display='block';
    renderDimTabs();renderDimContent();
    // OE content
    var oeEl=document.getElementById('vm-oe-content');
    oeEl.innerHTML=renderMd(currentCard.oe_content||'（無 OE 原始內容）');
    oeEl.style.display='none';
    document.getElementById('oe-chevron').className='ti ti-chevron-down';
  }

  // notes
  document.getElementById('vm-notes').value=currentCard.notes||'';
  document.getElementById('vm-notes').style.display='block';
  document.getElementById('vm-notes-preview').style.display='none';
  document.getElementById('notes-preview-btn').textContent='預覽';
  showNotesPreview=false;

  // ref
  var refVal=currentCard.ref_links||'';
  document.getElementById('vm-ref-area').value=refVal;
  document.getElementById('vm-ref-rendered').innerHTML=renderRefLinks(refVal);
  document.getElementById('vm-ref-area').style.display='none';
  document.getElementById('ref-edit-btn').textContent='編輯';
  refEditMode=false;

  document.getElementById('view-bg').style.display='flex';
}

function renderViewLinks(){
  var linked=currentCard.linked_cards||[];
  // 反向連結
  var backLinks=allCards.filter(function(c){
    return String(c.id)!==String(currentCard.id)&&
      (c.linked_cards||[]).some(function(l){return String(l)===String(currentCard.id);})&&
      linked.indexOf(String(c.id))===-1;
  });
  var allLinked=linked.map(function(lid){
    return allCards.find(function(c){return String(c.id)===String(lid);});
  }).filter(Boolean).concat(backLinks);

  document.getElementById('vm-links').innerHTML=allLinked.length
    ?'<div style="font-size:11px;color:var(--text3);margin-bottom:4px"><i class="ti ti-link"></i> 連結</div>'
      +allLinked.map(function(lc){
        var isCase=lc.type==='case';
        return '<span class="chip '+(isCase?'chip-case':'chip-link')+'" style="cursor:pointer;margin-bottom:3px" onclick="openCard(\''+lc.id+'\')">'
          +(isCase?'<i class="ti ti-clipboard-list"></i> ':'')+lc.title+'</span> ';
      }).join('')
    :'';
}

  } else {
    document.getElementById('edit-fields').innerHTML=
      KEYS.map(function(k,i){
        return '<label class="field-label" style="margin-top:10px">'+DIMS[i]+'</label>'
          +'<textarea class="edit-field" id="ef-'+k+'">'+escHtml(currentCard[k]||'')+'</textarea>';
      }).join('');
  }

  document.getElementById('view-bg').style.display='none';
  document.getElementById('edit-bg').style.display='flex';
}

async function saveEdit(){
  if(!currentCard) return;
  currentCard.title=document.getElementById('edit-title').value.trim()||currentCard.title;
  currentCard.case_number=document.getElementById('edit-case-num').value.trim();
  currentCard.importance=editSelectedImp;
  currentCard.contexts=Array.from(editSelectedTags);
  currentCard.ref_links=document.getElementById('edit-ref').value;

  var newLinks=Array.from(document.getElementById('edit-link-picker').querySelectorAll('input:checked')).map(function(i){return i.value;});
  var oldLinks=currentCard.linked_cards||[];
  // 移除舊反向連結
  oldLinks.forEach(function(lid){
    if(newLinks.indexOf(lid)===-1){
      var lc=allCards.find(function(c){return String(c.id)===String(lid);});
      if(lc){lc.linked_cards=(lc.linked_cards||[]).filter(function(x){return String(x)!==String(currentCard.id);});dbSave(lc);}
    }
  });
  // 加入新反向連結
  newLinks.forEach(function(lid){
    var lc=allCards.find(function(c){return String(c.id)===String(lid);});
    if(lc&&!(lc.linked_cards||[]).some(function(x){return String(x)===String(currentCard.id);})){
      (lc.linked_cards=lc.linked_cards||[]).push(String(currentCard.id));dbSave(lc);
    }
  });
  currentCard.linked_cards=newLinks;

  if(currentCard.type==='case'){
    var ef=document.getElementById('ef-content');if(ef)currentCard.content=ef.value;
  } else {
    KEYS.forEach(function(k){var el=document.getElementById('ef-'+k);if(el)currentCard[k]=el.value;});
    currentCard.auto_keywords=extractKeywords(currentCard.title+' '+KEYS.map(function(k){return currentCard[k]||'';}).join(' ')).join(' ');
  }

  await dbSave(currentCard);
  if(currentTab==='cases') renderCases();else renderKnowledgeCards();
  closeEdit();
}

function closeEdit(){document.getElementById('edit-bg').style.display='none';}

// ═══════════════════════════════════════
// EXPORT
// ═══════════════════════════════════════
function toggleExportMenu(){
  var m=document.getElementById('export-menu');
  m.style.display=m.style.display==='none'?'block':'none';
  if(m.style.display==='block') setTimeout(function(){document.addEventListener('click',function h(){m.style.display='none';document.removeEventListener('click',h);});},50);
}

function doExport(scope,fmt){
  document.getElementById('export-menu').style.display='none';
  var data=scope==='filtered'
    ?(currentTab==='cases'?getCasesFiltered():getCardsFiltered())
    :allCards;
  var content,ext;
  if(fmt==='json'){content=JSON.stringify(data,null,2);ext='json';}
  else{
    content=data.map(function(c){
      if(c.type==='case') return'# [個案] '+c.title+'\n\n'+( c.content||'')+'\n\n---\n';
      return'# '+c.title+'\n\n'
        +DIMS.map(function(d,i){return'## '+d+'\n'+(c[KEYS[i]]||'—');}).join('\n\n')
        +(c.notes?'\n\n## 筆記\n'+c.notes:'')+'\n\n---\n';
    }).join('\n');ext='md';
  }
  var blob=new Blob([content],{type:'text/plain'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='clinical_'+new Date().toISOString().slice(0,10)+'.'+ext;
  a.click();URL.revokeObjectURL(url);
}

(function boot(){
  // 先填入 Supabase 設定讓 auth 可以用
  initSupabase();
  if(!handleAuthCallback()){
    // 沒有 token，顯示登入頁
    // 但如果 Supabase 還沒設定，先跳過直接進 app
    if(!cfg('sb_url')||!cfg('sb_key')){
      showApp();
    } else {
      showLogin();
    }
  }
})();
